services:
  falkordb:
    image: falkordb/falkordb:v4.18.11   # pinned: the code targets 4.18 (6.x changed the fulltext index API)
    ports:
      - "6379:6379"   # graph (Redis protocol)
      - "3000:3000"   # FalkorDB Browser: http://localhost:3000
    volumes:
      - falkordb-data:/var/lib/falkordb/data
    restart: unless-stopped

volumes:
  falkordb-data:
